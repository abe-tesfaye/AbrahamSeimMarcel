<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Members</h1>
    <a href="/member/add" class="btn btn-primary mb-3">Add New Member</a>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr data-th-each="member : ${members}">
            <td data-th-text="${member.memberId}"></td>
            <td data-th-text="${member.username}"></td>
            <td data-th-text="${member.email}"></td>
            <td data-th-text="${member.status}"></td>
            <td>
                <a data-th-href="@{/member/{id}(id=${member.memberId})}" class="btn btn-sm btn-primary">Details</a>
                <a data-th-href="@{/member/edit/{id}(id=${member.memberId})}" class="btn btn-sm btn-secondary">Edit</a>
                <a data-th-href="@{/member/delete/{id}(id=${member.memberId})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
