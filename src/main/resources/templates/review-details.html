<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Review Details</h1>
    <p><strong>Content:</strong> <span data-th-text="${review.content}"></span></p>
    <p><strong>Rating:</strong> <span data-th-text="${review.rating}"></span></p>
    <p><strong>Product ID:</strong> <span data-th-text="${review.productId}"></span></p>
    <p><strong>Member ID:</strong> <span data-th-text="${review.member.memberId}"></span></p>
    <a href="/reviews" class="btn btn-secondary">Back to Reviews</a>
</div>
</body>
</html>
