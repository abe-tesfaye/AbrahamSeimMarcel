<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <title>Member Search</title>
</head>

<body>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px;">
  <div>
    <a href="Index.html">Home</a> |
    <a href="SignUpPage.html" style="color: black;">Join Today</a> |
    <a href="LoginPage.html" style="color: black;">Sign In</a>
  </div>
</div>

<hr>

<div id="Banner">
  <header style="position: relative; text-align: center;">
    <img src="images/Banner.jpg" alt="Nothin' But Net Banner" style="width: 100%; height: auto;">
    <div style="position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%);">
      <h1 style="color: white; font-size: 5rem; font-weight: bold;">Admin</h1>
    </div>
  </header>
</div>

<br>

<div style="width: 80%; margin: 20px auto; padding: 20px; background-color: #f9f9f9; border-radius: 5px;">
  <h2>Admin Dashboard</h2>
  <fieldset style="height: 300px; overflow-y: scroll; padding: 10px; border: 1px solid #ccc;">
    <legend>Member Search</legend>

    <form action="/search" method="get">
      <label for="MemberID">MemberID:</label>
      <input type="text" id="MemberID" name="MemberID" style="width: 100%;"><br><br>

      <label for="MemberUsername">Member Username:</label>
      <input type="password" id="MemberUsername" name="MemberUsername" style="width: 100%;"><br><br>

      <input type="submit" value="Search" style="width: 100%;">
    </form>
  </fieldset>
</div>

</body>

</html>
