<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 data-th-text="'Details for: ' + ${member.username}"></h1>
    <p><strong>First Name:</strong> <span data-th-text="${member.firstName}"></span></p>
    <p><strong>Last Name:</strong> <span data-th-text="${member.lastName}"></span></p>
    <p><strong>Email:</strong> <span data-th-text="${member.email}"></span></p>
    <p><strong>Status:</strong> <span data-th-text="${member.status}"></span></p>
    <h2>Reviews</h2>
    <ul>
        <li data-th-each="review : ${reviews}">
            <span data-th-text="${review.content}"></span> -
            <span data-th-text="${review.rating}"></span> stars
            <a data-th-href="@{/member/{memberId}/reviews/delete/{reviewId}(memberId=${member.memberId}, reviewId=${review.reviewId})}" class="btn btn-sm btn-danger">Delete</a>
        </li>
    </ul>
    <a data-th-href="@{/member/{id}/reviews/add(id=${member.memberId})}" class="btn btn-primary">Add Review</a>
    <a href="/member" class="btn btn-secondary">Back to Members</a>
</div>
</body>
</html>
