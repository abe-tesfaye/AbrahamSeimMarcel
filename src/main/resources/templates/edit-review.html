<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Edit Review</h1>
    <form action="/reviews/update" method="post">
        <input type="hidden" name="reviewId" data-th-value="${review.reviewId}">
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" name="content" data-th-text="${review.content}" required></textarea>
        </div>
        <div class="mb-3">
            <label for="rating" class="form-label">Rating</label>
            <input type="number" class="form-control" id="rating" name="rating" data-th-value="${review.rating}" min="1" max="5" required>
        </div>
        <div class="mb-3">
            <label for="productId" class="form-label">Product ID</label>
            <input type="number" class="form-control" id="productId" name="productId" data-th-value="${review.productId}" required>
        </div>
        <div class="mb-3">
            <label for="memberId" class="form-label">Member ID</label>
            <input type="number" class="form-control" id="memberId" name="memberId" data-th-value="${review.member.memberId}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
</body>
</html>
