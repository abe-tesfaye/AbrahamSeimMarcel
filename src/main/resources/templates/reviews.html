<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Reviews</h1>
    <a href="/reviews/add" class="btn btn-primary mb-3">Add New Review</a>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Content</th>
            <th>Rating</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr data-th-each="review : ${reviews}">
            <td data-th-text="${review.reviewId}"></td>
            <td data-th-text="${review.content}"></td>
            <td data-th-text="${review.rating}"></td>
            <td>
                <a data-th-href="@{/reviews/{id}(id=${review.reviewId})}" class="btn btn-sm btn-primary">Details</a>
                <a data-th-href="@{/reviews/edit/{id}(id=${review.reviewId})}" class="btn btn-sm btn-secondary">Edit</a>
                <a data-th-href="@{/reviews/delete/{id}(id=${review.reviewId})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
